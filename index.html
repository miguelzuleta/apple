<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Apple Discounts</title>
	<style>
		*, *:before, *:after {
		  margin: 0;
		  padding: 0;
		}

		body {
		  background-color: #000;
		  display: flex;
		  padding: 25px;
		  justify-content: center;
		}

		.loading {
			text-transform: uppercase;
			padding-block: 20px;
			text-align: center;
		}

		#discounts {
			--padding: 12px;
			
		  background-color: #fff;
		  padding: var(--padding) 25px;
		  width: 600px;
		  box-sizing: border-box;
		  border-radius: 10px;
		  font-size: 14px;
		  letter-spacing: 0.015em;
		  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
		}

		.row {
		  display: flex;
		  padding: 0 var(--padding);
		  border: 1px solid #ddd;
		  border-width: 0 0 1px;
		  align-items: center;
		}

		.row * {
		  color: #111;
		  padding: 25px 0;
		}
		
		.row:last-child {
		  border: none;
		}
		
		.row.header {
		  background-color: #fff;
		  font-weight: bold;
		  font-size: 16px;
		  position: sticky;
		  top: 0;
		}

		.row.sold-out .count {
		  flex-grow: 1;
		}
		
		.product {
		  width: 50%;
		}
		
		.count {
		  width: 25%;
		  text-align: center;
		}

		.sold-out *,
		.sold-out {
		  color: #bbb;
		}

		/* Creates a solid bar at the bottom for Safari to sample */
		.safari-bottom-shim {
			/* --color-offset: 4px; */
			
		  position: fixed;
		  bottom: -14px; /* Pushes it just slightly out of view */
		  left: 0;
		  width: 100%;
		  height: 15px; /* Must be at least 3px tall to trigger sampling */
		  background-color: yellow; /* Your desired solid color */
		  opacity: 1; /* MUST be exactly 1 to turn off transparency */
		  z-index: 9999;
		}

	</style>
</head>
<body>
	<div class="safari-bottom-shim"></div>
	<section id="discounts"></section>
	<script src="https://miguelzuleta.com/append/index.js"></script>
	<script>
		append('#discounts', `<p class="loading" bb-label="loading">loading...</p>`);
		
		let year = new Date().getFullYear();

		let discountData = {
			2026: '1J_xP2QIh5kT4E4KiTy1CVS5UKXVFtmVdOx5Yky7a-bs',
			2027: '1VooZ7urFPnxl5TjQIsXjZslrG0CDMhqtCjkqnOAWCoA'
		}

		let spreadsheet = `https://docs.google.com/spreadsheets/d/${discountData[year]}/export?format=csv`;

		fetch(spreadsheet).then(data => data.text()).then(data => {
			let discountList = `
				<div class="row header">
					<div class="product">Product Discount</div>
					<div class="count">25%</div>
					<div class="count">15%</div>
				</div>
			`;
			let discountRows = data.split(/\r?\n/);

			discountRows.forEach(row => {
				let rowData = row.split(',');
				
				let discountType = {
					personal: rowData[1],
					friends: rowData[2]
				}

				let soldOut = (discountType.personal == 0) && (discountType.friends == 0);

				if (soldOut) {
					discountType.personal = 'Sold Out';
					delete discountType.friends;
				}

				discountList += `
					<div class="row${soldOut ? ' sold-out' : ''}">
						<p class="product">${rowData[0]}</p>
						${Object.keys(discountType).map(key => {
							return `<div class="count">${discountType[key]}</div>`
						}).join('')}
					</div>
				`;
			})

			window.appended.loading.remove();
			append('#discounts', discountList);
		})
	</script>
</body>
</html>
